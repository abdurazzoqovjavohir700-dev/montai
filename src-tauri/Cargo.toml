[package]
name = "montai"
version = "1.3.0"
description = "Montai — AI-powered video editing mentor"
authors = ["Montai Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "montai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "montai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
